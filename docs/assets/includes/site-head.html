<script>
(function () {
  var mobileCharts = window.matchMedia("(max-width: 767.98px)");

  function updateChart(image) {
    var mobileSource = image.getAttribute("data-mobile-src");
    if (!mobileSource) return;

    if (!image.hasAttribute("data-desktop-src")) {
      image.setAttribute("data-desktop-src", image.getAttribute("src"));
      image.setAttribute("data-desktop-width", image.getAttribute("width") || "");
      image.setAttribute("data-desktop-height", image.getAttribute("height") || "");
    }

    if (mobileCharts.matches) {
      image.setAttribute("src", mobileSource);
      image.setAttribute("width", image.getAttribute("data-mobile-width"));
      image.setAttribute("height", image.getAttribute("data-mobile-height"));
    } else {
      image.setAttribute("src", image.getAttribute("data-desktop-src"));
      image.setAttribute("width", image.getAttribute("data-desktop-width"));
      image.setAttribute("height", image.getAttribute("data-desktop-height"));
    }
  }

  function updateCharts(root) {
    if (root.nodeType === 1 && root.matches("img[data-mobile-src]")) updateChart(root);
    if (root.querySelectorAll) {
      root.querySelectorAll("img[data-mobile-src]").forEach(updateChart);
    }
  }

  var observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (mutation) {
      mutation.addedNodes.forEach(updateCharts);
    });
  });

  observer.observe(document.documentElement, { childList: true, subtree: true });
  mobileCharts.addEventListener("change", function () { updateCharts(document); });
  document.addEventListener("DOMContentLoaded", function () {
    updateCharts(document);
    observer.disconnect();
  });
})();
</script>
