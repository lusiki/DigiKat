      - text: "Metodologija"
        href: pages/metodologija.qmd
      - text: "Mapa medijskog prostora"
        menu:
          - text: "Pregled mapa"
            href: pages/mapa/index.qmd
          - text: "Mapa ekosustava"
            href: pages/mapa/mapa.qmd
          - text: "Tematske struje"
            href: pages/mapa/mapa_stats.qmd
          - text: "Atmosfera diskursa"
            href: pages/mapa/diskurs.qmd
          - text: "Fokus na događaje i kampanje"
            href: pages/mapa/događaji.qmd
          - text: "Evolucija ekosustava"
            href: pages/mapa/evolucija.qmd
      - text: "Tematska istraživanja"
        menu:
          - text: "Pregled istraživanja"
            href: pages/studije/index.html
          - text: "Tržišta pažnje u religijskim digitalnim medijima"
            href: pages/studije/trzista-paznje.html
          - text: "Memorijalni okvir hrvatskih katoličkih odredišta"
