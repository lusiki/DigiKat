project:
  type: website
  output-dir: docs
  resources:
    - assets/
    - CITATION.cff
    - data/digikat_corpus_manifest.json
    - data/processed/
    - data/sample/merged_sample.rds
    - data/sample/merged_sample_manifest.json
    - .nojekyll
    - listings.json
    - favicon.ico
  # Only the active site sources render. Prevents auto-globbing root project
  # documentation and archived prototypes into the published docs/.
  render:
    - index.qmd
    - pages/**/*.qmd
    # Dovršena tematska istraživanja ostaju na verzioniranim ulazima na kojima
    # su objavljena; puni render žive stranice ne smije ih ponovno izračunati.
    # Pregled istraživanja ostaje aktivna stranica i renderira se redovito.
    - "!pages/studije/crkva-i-dezinformacije.qmd"
    - "!pages/studije/hodocasnicki-turizam.qmd"
    - "!pages/studije/inflacija-i-religija.qmd"
    - "!pages/studije/katolicki-influenceri.qmd"
    - "!pages/studije/katolicko-obrazovanje-i-stepinac.qmd"
    - "!pages/studije/redovnicke-zajednice.qmd"
    - "!pages/studije/socijalni-nauk-i-gospodarstvo.qmd"
    - "!pages/studije/trzista-paznje.qmd"

lang: hr
website:
  title: "DigiKat"
  description: "DigiKat je otvoreni opservatorij koji pokazuje tko u Hrvatskoj objavljuje o katoličkim temama, o čemu govori i što privlači pozornost."
  site-url: https://lusiki.github.io/DigiKat/
  favicon: assets/favicon.svg
  image: assets/images/digikat-social-card.png
  image-alt: "DigiKat. Katolički medijski opservatorij Hrvatskoga katoličkog sveučilišta."
  open-graph:
    locale: hr_HR
    site-name: DigiKat
  twitter-card: true
  navbar:
    left:
      - text: "Istražite"
        menu:
          - text: "Mapa medijskog prostora"
            href: pages/mapa/index.qmd
          - text: "Moj medij"
            href: pages/moj-medij.qmd
          - text: "Katalog izvora"
            href: pages/izvori/index.qmd
          - text: "Izvršni pregled"
            href: pages/pregled/izvrsni-pregled.qmd
      - text: "Podaci i metodologija"
        menu:
          - text: "Službeni korpus"
            href: pages/baza.qmd
          - text: "Metodologija"
            href: pages/metodologija.qmd
          - text: "Reproducibilnost"
            href: pages/metodologija.qmd#method-reproducibility
          - text: "Citiranje i pristup"
            href: pages/baza.qmd#pristup-licencija-i-citiranje
          - text: "Javni resursi"
            href: pages/resources.qmd
      - text: "Istraživanja"
        menu:
          - text: "Tematska istraživanja"
            href: pages/studije/index.html
          - text: "Godišnji pregled 2025."
            href: assets/izvjestaji/godisnji-pregled-2025.html
          - text: "Kako se govori o Crkvi?"
            href: assets/izvjestaji/kako-se-govori-o-crkvi/index.html
      - text: "O projektu"
        menu:
          - text: "O projektu"
            href: pages/about.qmd
          - text: "Obavijesti"
            href: pages/news.qmd
          - text: "Projektni raspored"
            href: pages/schedule.qmd
          - text: "Kontakt"
            href: pages/contact.qmd
  page-footer:
    background: "#0f1419"
    foreground: "#aeb4b8"
    border: false
    left: |
      **DigiKat** · Hrvatsko katoličko sveučilište
    center:
      - text: "Naslovnica"
        href: index.qmd
      - text: "Resursi"
        href: pages/resources.qmd
      - text: "O stranici"
        href: pages/site-info.qmd
      - text: "Kontakt"
        href: pages/contact.qmd
      - text: "GitHub"
        href: https://github.com/lusiki/DigiKat
    right: |
      CC BY 4.0 · © 2021–2026 DigiKat

# Reuse cached chunk executions; a full render only re-runs pages whose code
# changed. The three NLP pages now read compact data/page-ready summaries.
execute:
  freeze: auto

format:
  html:
    theme:
      - cosmo
      - assets/css/custom.scss
    toc: true
    toc-location: left
    toc-depth: 3
    smooth-scroll: true
    echo: false
    code-fold: false
    code-tools: false
    code-copy: true
    mainfont: "Source Sans 3"
    monofont: "IBM Plex Mono"
    fig-align: center
    include-in-header:
      - file: assets/includes/site-head.html
    canonical-url: true
