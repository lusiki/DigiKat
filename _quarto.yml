    right:
      - text: "O stranici"
        href: pages/site-info.qmd
      - icon: github
        href: https://github.com/lusiki/DigiKat
  page-footer:
    background: "#0f1419"
    foreground: "#aeb4b8"
    border: false
    left: |
      **DigiKat** · Hrvatsko katoličko sveučilište
    center:
      - text: "Moj medij"
        href: pages/moj-medij.qmd
      - text: "Baza podataka"
        href: pages/baza.qmd
      - text: "Metodologija"
        href: pages/metodologija.qmd
      - text: "Resursi"
        href: pages/resources.qmd
      - text: "GitHub"
        href: https://github.com/lusiki/DigiKat
    right: |
      CC BY 4.0 · © 2021–2026 DigiKat

# Reuse cached chunk executions; a full render only re-runs pages whose code
# changed. The three NLP pages now read compact data/page-ready summaries.
execute:
  freeze: auto

format:
  html:
    theme:
      - cosmo
      - assets/css/custom.scss
    toc: true
    toc-location: left
    toc-depth: 3
    smooth-scroll: true
    echo: false
    code-fold: false
    code-tools: false
    code-copy: true
    mainfont: "Source Sans 3"
    monofont: "IBM Plex Mono"
    fig-align: center
    include-in-header:
      - text: |
          <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
