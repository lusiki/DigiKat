name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline-and-site:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      # Keep the private semantic stack out of CI restore. Barometer tests use
      # the separately pinned/checksummed Windows DuckDB binary installed below;
      # the empirical 1.5.4 lock and source fingerprints remain unchanged.
      - name: Drop local-only semantic packages from the CI lockfile
        shell: bash
        run: jq 'del(.Packages.duckdb, .Packages.ragnar)' renv.lock > renv.lock.tmp && mv renv.lock.tmp renv.lock

      - uses: r-lib/actions/setup-renv@v2

      - name: Install verified DuckDB binary for invented-data checks
        shell: pwsh
        run: Rscript scripts/install_ci_duckdb.R

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install browser-quality dependency
        shell: pwsh
        run: npm ci

      # One script per step ON PURPOSE. In a pwsh step only the LAST command's exit code decides the
      # step's outcome, so a batch of Rscript calls reports success while an earlier one is failing —
      # which is exactly how a failing tests/run_tests.R went unnoticed until the link check went red.
      - name: Unit and source checks
        shell: pwsh
        run: Rscript tests/run_tests.R

      - name: Barometer browser-core checks
        shell: pwsh
        run: node --test tests/barometar_core.test.cjs tests/barometar_multiplatform.test.cjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the all-platform extraction test dependency
        run: python -m pip install duckdb==1.5.5

      - name: All-platform identity and aggregate fixtures
        run: python tests/barometar_multiplatform_tests.py

      - name: All-platform text and contextual-rule checks
        shell: pwsh
        run: Rscript tests/barometar_multiplatform_tests.R

      - name: Verify the committed empirical release
        run: python studies/demokrscanstvo-barometar/multiplatform_verify.py --html docs/pages/demokrscanstvo/index.html

      - name: Barometer source-to-release synthetic check
        shell: pwsh
        run: Rscript studies/demokrscanstvo-barometar/run.R --sample

      - name: Whole-site source-quality contract
        shell: pwsh
        run: Rscript tests/check_run6_site_quality.R

      - name: Source registry check
        shell: pwsh
        run: Rscript R/check_sources.R

      - name: Disclosure check
        shell: pwsh
        run: Rscript R/check_disclosure.R

      - name: Setup and resource validation
        shell: pwsh
        run: Rscript R/00_setup.R

      - name: Aggregate preview against the synthetic sample
        shell: pwsh
        run: Rscript R/03_aggregate.R --master=data/sample/merged_sample.rds --output-dir="${{ runner.temp }}/processed"

      - name: NLP build against the synthetic sample
        shell: pwsh
        run: Rscript R/04_nlp.R --build --master=data/sample/merged_sample.rds

      - name: Render the full site
        shell: pwsh
        run: quarto render

      # The finished thematic studies are excluded from the render in _quarto.yml, so that a live-site
      # build can never recompute the numbers they published. Their HTML is versioned under docs/
      # instead, and a full render drops output whose input is not in the render list — restore the
      # nine published files and their reviewed figure assets from git so the link check crawls the
      # site as it is actually served.
      #
      # site_libs too: those nine pages were frozen against content-hashed CSS bundle names, and a
      # different Quarto/dart-sass compiles the theme to a different hash, so this render's bundles do
      # not carry the names they ask for. Restoring only ADDS the tracked bundles back beside the ones
      # just rendered, so a page pointing at an asset that genuinely exists nowhere still fails.
      - name: Restore the versioned output the render does not reproduce
        shell: pwsh
        run: |
          git checkout -- docs/pages/studije docs/studies docs/site_libs
          $n = (Get-ChildItem docs/pages/studije -Filter *.html).Count
          if ($n -lt 9) { throw "Expected 9 published study pages under docs/pages/studije, found $n" }

      - name: Check rendered local links
        shell: pwsh
        run: Rscript R/check_site_links.R

      - name: Verify the rendered empirical release
        run: python studies/demokrscanstvo-barometar/multiplatform_verify.py --root docs/data/barometar/demokrscanstvo-multiplatform/v1 --html docs/pages/demokrscanstvo/index.html

      - name: Check rendered metadata, structure and page budgets
        shell: pwsh
        run: npm run check:site

      - name: Check required viewports and accessibility
        shell: pwsh
        run: npm run check:browser
