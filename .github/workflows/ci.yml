name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline-and-site:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
          use-public-rspm: true

      # The semantic-search stack (duckdb + ragnar) powers the local, gitignored
      # data/semantic/*.duckdb store only. CI never loads it, and duckdb has no CI
      # binary so it compiles from source and fails. Drop both from the lockfile CI
      # restores from; the tracked renv.lock is untouched (local semantic work still works).
      - name: Drop local-only semantic packages from the CI lockfile
        shell: bash
        run: jq 'del(.Packages.duckdb, .Packages.ragnar)' renv.lock > renv.lock.tmp && mv renv.lock.tmp renv.lock

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      # One script per step ON PURPOSE. In a pwsh step only the LAST command's exit code decides the
      # step's outcome, so a batch of Rscript calls reports success while an earlier one is failing —
      # which is exactly how a failing tests/run_tests.R went unnoticed until the link check went red.
      - name: Unit and source checks
        shell: pwsh
        run: Rscript tests/run_tests.R

      - name: Source registry check
        shell: pwsh
        run: Rscript R/check_sources.R

      - name: Disclosure check
        shell: pwsh
        run: Rscript R/check_disclosure.R

      - name: Setup and resource validation
        shell: pwsh
        run: Rscript R/00_setup.R

      - name: Aggregate preview against the synthetic sample
        shell: pwsh
        run: Rscript R/03_aggregate.R --master=data/sample/merged_sample.rds --output-dir="${{ runner.temp }}/processed"

      - name: NLP build against the synthetic sample
        shell: pwsh
        run: Rscript R/04_nlp.R --build --master=data/sample/merged_sample.rds

      - name: Render the full site
        shell: pwsh
        run: |
          Copy-Item data/sample/merged_sample.rds data/merged_comprehensive.rds
          quarto render

      # The finished thematic studies are excluded from the render in _quarto.yml, so that a live-site
      # build can never recompute the numbers they published. Their HTML is versioned under docs/
      # instead, and a full render drops output whose input is not in the render list — restore the
      # nine published files from git so the link check crawls the site as it is actually served.
      - name: Restore the versioned study pages the render does not produce
        shell: pwsh
        run: |
          git checkout -- docs/pages/studije
          $n = (Get-ChildItem docs/pages/studije -Filter *.html).Count
          if ($n -lt 9) { throw "Expected 9 published study pages under docs/pages/studije, found $n" }

      - name: Check rendered local links
        shell: pwsh
        run: Rscript R/check_site_links.R
